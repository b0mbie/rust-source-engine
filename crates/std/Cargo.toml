[package]
name = "rse-std"
version = "0.1.0"
edition = "2024"
authors.workspace = true

[lints]
workspace = true

[features]
default = [
	"proc-macros",
	"global-allocator",
	"fs",
	"cvar-autoregister",
]
link-srv = ["rse-tier0/link-srv"]
link-optional = ["rse-tier0/link-optional"]
doc = [
	"link-optional",
	"cl", "sv",
]
proc-macros = ["dep:rse-std-macros"]
global-allocator = []

cl = ["dep:rse-client"]
sv = ["dep:rse-server"]
fs = []

cvar-autoregister = []

[dependencies]
atomic-wait = "1.1.0"
libc.workspace = true
thiserror.workspace = true
rse-convar.workspace = true
rse-cpp.workspace = true
rse-shared.workspace = true
rse-game-interfaces.workspace = true
rse-interface.workspace = true
rse-plugin.workspace = true
rse-utl.workspace = true

[dependencies.rse-std-macros]
path = "../std-macros"
optional = true

[dependencies.rse-tier0]
path = "../tier0"
default-features = false
features = ["link-dll"]

[dependencies.rse-client]
workspace = true
optional = true

[dependencies.rse-server]
workspace = true
optional = true

[dependencies.atomic]
version = "0.6.1"
default-features = false

[dependencies.ctor]
version = "0.6.1"
default-features = false

[dependencies.thread-bound]
git = "https://github.com/b0mbie/thread-bound-rs.git"
default-features = false
